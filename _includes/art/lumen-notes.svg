  <rect class="art-ink" x="152" y="36" width="108" height="222" rx="16"/>
  <rect class="art-fig" x="160" y="48" width="92" height="198" rx="10"/>
  <rect class="art-ink" x="172" y="64" width="46" height="8" rx="2"/>
